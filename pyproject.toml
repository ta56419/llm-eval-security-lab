[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-security-lab"
version = "0.1.0"
description = "Offline evaluation harness for RAG and LLM applications"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
llm-eval = "llm_eval_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
